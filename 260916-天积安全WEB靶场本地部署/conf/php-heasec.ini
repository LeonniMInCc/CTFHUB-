; ================= HeaSec 靶场运行时配置 =================
; 说明：本机目录含中文，PHP 7.3 从非 ASCII 绝对路径加载扩展会崩溃，
; 故使用相对扩展目录；启动脚本会把工作目录设为本 PHP 目录。
extension_dir = "ext"
extension=curl
extension=fileinfo
extension=gd2
extension=mbstring
extension=exif
extension=mysqli
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=openssl
extension=sockets
extension=soap
extension=xmlrpc
extension=xsl
extension=bz2
; 注意：本构建已静态内置 zip，重复 extension=zip 会导致 php 启动崩溃
short_open_tag = On
output_buffering = 4096
max_execution_time = 300
max_input_time = 60
memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20
max_input_vars = 3000
error_reporting = E_ALL & ~E_NOTICE
display_errors = On
display_startup_errors = On
log_errors = On
default_charset = "UTF-8"
date.timezone = Asia/Shanghai
allow_url_fopen = On
allow_url_include = Off
expose_php = On
session.save_handler = files
session.gc_divisor = 1000
mysqli.default_port = 3306